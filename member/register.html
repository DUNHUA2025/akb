<!DOCTYPE html>
<html lang="zh-TW" data-theme="jade">
<head>
<script>
(function(){
  var t=localStorage.getItem('akb_theme_name')||'jade';
  var d=localStorage.getItem('akb_dark_mode');
  var dark=d===null?true:d==='true';
  document.documentElement.setAttribute('data-theme',t);
  if(!dark)document.documentElement.classList.add('light');
})();
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>會員註冊 — AKB 多元化音樂發廊</title>
<link rel="icon" href="../favicon.ico" type="image/x-icon"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/themes.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 16px 60px;}
.serif{font-family:'Noto Serif TC',serif;}

/* ── Page wrap ── */
.page-wrap{width:100%;max-width:520px;}

/* ── Back ── */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text3);text-decoration:none;font-size:13px;margin-bottom:28px;transition:color .2s;}
.back-link:hover{color:var(--primary);}

/* ── Header ── */
.page-header{text-align:center;margin-bottom:32px;}
.logo-ring{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;box-shadow:0 4px 24px color-mix(in srgb,var(--primary) 35%,transparent);}
.page-header h1{font-size:22px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-header p{font-size:13px;color:var(--text3);}

/* ── Benefits ── */
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px;}
.benefit-card{background:color-mix(in srgb,var(--primary) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--primary) 18%,transparent);border-radius:12px;padding:14px 8px;text-align:center;}
.benefit-card .bi{font-size:22px;margin-bottom:6px;}
.benefit-card .bl{font-size:11px;color:var(--text2);font-weight:500;}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px;}
@media(max-width:480px){.card{padding:24px 18px;border-radius:16px;}}

/* ── Form ── */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px;letter-spacing:.02em;}
.req{color:var(--rose);margin-left:2px;}
.field input,.field select{
  width:100%;padding:11px 14px;
  background:color-mix(in srgb,var(--surface2) 80%,var(--bg));
  border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent);}
.field input.ok{border-color:var(--green);}
.field input.err{border-color:var(--rose);}
.field select option{background:var(--bg);}
.err-msg{font-size:11px;color:var(--rose);margin-top:5px;min-height:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:400px){.grid2{grid-template-columns:1fr;}}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px;transition:color .2s;}
.pw-eye:hover{color:var(--primary);}

/* ── Strength bar ── */
.strength-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;}
.strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;}
.strength-label{font-size:11px;color:var(--text3);margin-top:4px;}

/* ── Terms ── */
.terms-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;font-size:12px;color:var(--text2);}
.terms-row input[type=checkbox]{width:16px;height:16px;margin-top:1px;flex-shrink:0;accent-color:var(--primary);}
.terms-row a{color:var(--primary);text-decoration:none;}
.terms-row a:hover{text-decoration:underline;}

/* ── Alert ── */
.alert{display:none;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
.alert.show{display:block;}
.alert.error{background:color-mix(in srgb,var(--rose) 12%,transparent);border:1px solid color-mix(in srgb,var(--rose) 30%,transparent);color:var(--rose);}

/* ── Buttons ── */
.btn-submit{
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .2s,transform .15s;
  margin-bottom:16px;
}
.btn-submit:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn-submit:disabled{opacity:.55;cursor:not-allowed;}

/* ── Divider ── */
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text3);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── Login link ── */
.login-link{
  display:block;text-align:center;padding:12px;
  border:1.5px solid var(--border);border-radius:12px;
  color:var(--text2);text-decoration:none;font-size:14px;font-weight:500;
  transition:border-color .2s,color .2s;
}
.login-link:hover{border-color:var(--primary);color:var(--primary);}

/* ── Footer links ── */
.footer-links{text-align:center;margin-top:20px;font-size:12px;color:var(--text3);}
.footer-links a{color:var(--primary);text-decoration:none;margin:0 6px;}

/* ── Spinner ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="page-wrap">

  <a href="../index.html" class="back-link">← 返回首頁</a>

  <!-- Header -->
  <div class="page-header">
    <div class="logo-ring">💎</div>
    <h1 class="serif">會員自助註冊</h1>
    <p>加入 AKB 會員，享受專屬優惠與積分獎勵</p>
  </div>

  <!-- Benefits -->
  <div class="benefits">
    <div class="benefit-card"><div class="bi">⭐</div><div class="bl">消費積分</div></div>
    <div class="benefit-card"><div class="bi">🏷️</div><div class="bl">會員折扣</div></div>
    <div class="benefit-card"><div class="bi">📋</div><div class="bl">預約記錄</div></div>
  </div>

  <!-- Card -->
  <div class="card">

    <div class="alert error" id="globalAlert"></div>

    <form id="regForm" novalidate>

      <!-- Phone -->
      <div class="field">
        <label>手機號碼 <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="例：91234567 或 09XXXXXXXX" maxlength="20" autocomplete="tel"/>
        <div class="err-msg" id="phoneErr"></div>
      </div>

      <!-- Name + Gender -->
      <div class="grid2">
        <div class="field">
          <label>姓名 <span class="req">*</span></label>
          <input type="text" id="name" placeholder="您的稱呼" maxlength="50" autocomplete="name"/>
          <div class="err-msg" id="nameErr"></div>
        </div>
        <div class="field">
          <label>性別</label>
          <select id="gender">
            <option value="">不願透露</option>
            <option value="F">女</option>
            <option value="M">男</option>
            <option value="other">其他</option>
          </select>
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label>電子郵件 <span style="color:var(--text3);font-weight:400;">（選填）</span></label>
        <input type="email" id="email" placeholder="your@email.com" maxlength="100" autocomplete="email"/>
        <div class="err-msg" id="emailErr"></div>
      </div>

      <!-- Birthday -->
      <div class="field">
        <label>生日 <span style="color:var(--text3);font-weight:400;">（選填）</span></label>
        <input type="date" id="birthday"/>
      </div>

      <!-- Password -->
      <div class="field">
        <label>設定密碼 <span class="req">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="至少 6 位，建議含字母及數字" maxlength="100" autocomplete="new-password"/>
          <button type="button" class="pw-eye" data-target="password">👁</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0;background:var(--rose);"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
        <div class="err-msg" id="passwordErr"></div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label>確認密碼 <span class="req">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="confirmPassword" placeholder="再次輸入密碼" maxlength="100" autocomplete="new-password"/>
          <button type="button" class="pw-eye" data-target="confirmPassword">👁</button>
        </div>
        <div class="err-msg" id="confirmErr"></div>
      </div>

      <!-- Terms -->
      <div class="terms-row">
        <input type="checkbox" id="agree"/>
        <label for="agree">我同意 AKB 的<a href="#">服務條款</a>及<a href="#">隱私政策</a>，並同意接收預約提醒通知</label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">立即免費加入</button>
    </form>

    <div class="divider">已有帳號？</div>
    <a href="./login.html" class="login-link">登入會員帳號 →</a>

    <div class="footer-links">
      <a href="../index.html">← 返回首頁</a>
      <a href="../client/index.html">立即預約</a>
    </div>
  </div>
</div>

<script>
// ── API ──────────────────────────────────────────────────────
const API_BASE = (function(){
  const h = location.hostname;
  if(h==='localhost'||h==='127.0.0.1') return 'http://'+h+':3001';
  return window.AKB_API_URL || 'https://akb-salon-server.onrender.com';
})();

// ── Already logged in? ───────────────────────────────────────
if(localStorage.getItem('akb_member_token')&&localStorage.getItem('akb_member')){
  location.replace('./index.html');
}

// ── Password eye toggle ──────────────────────────────────────
document.querySelectorAll('.pw-eye').forEach(btn=>{
  btn.addEventListener('click',function(){
    const inp=document.getElementById(this.dataset.target);
    inp.type=inp.type==='password'?'text':'password';
    this.textContent=inp.type==='password'?'👁':'🙈';
  });
});

// ── Strength meter ───────────────────────────────────────────
function checkStrength(pwd){
  const fill=document.getElementById('strengthFill');
  const lbl=document.getElementById('strengthLabel');
  if(!pwd){fill.style.width='0';lbl.textContent='';return;}
  let s=0;
  if(pwd.length>=6)s++;
  if(pwd.length>=10)s++;
  if(/[A-Z]/.test(pwd))s++;
  if(/[0-9]/.test(pwd))s++;
  if(/[^A-Za-z0-9]/.test(pwd))s++;
  const cfg=[[20,'var(--rose)','弱'],[40,'#fb923c','尚可'],[60,'#facc15','中等'],[80,'var(--green)','強'],[100,'var(--primary)','非常強']];
  const [w,c,t]=cfg[Math.min(s,cfg.length)-1]||cfg[0];
  fill.style.width=w+'%'; fill.style.background=c; lbl.textContent='密碼強度：'+t;
}
document.getElementById('password').addEventListener('input',function(){checkStrength(this.value);clearErr('passwordErr');});

// ── Field helpers ────────────────────────────────────────────
function showErr(id,msg){const e=document.getElementById(id);if(e){e.textContent=msg;}}
function clearErr(id){const e=document.getElementById(id);if(e){e.textContent='';}}
function setOk(id){const inp=document.getElementById(id);if(inp){inp.classList.remove('err');inp.classList.add('ok');}}
function setErr(id,errId,msg){const inp=document.getElementById(id);if(inp){inp.classList.add('err');inp.classList.remove('ok');}showErr(errId,msg);}

// ── Real-time validation ─────────────────────────────────────
document.getElementById('phone').addEventListener('blur',function(){
  const v=this.value.trim();
  if(v&&!/^[0-9+\-\s]{8,20}$/.test(v)) setErr('phone','phoneErr','手機號格式不正確（至少8位數字）');
  else if(v) setOk('phone');
});
document.getElementById('confirmPassword').addEventListener('input',function(){
  const pwd=document.getElementById('password').value;
  if(this.value&&this.value!==pwd) setErr('confirmPassword','confirmErr','兩次密碼不一致');
  else clearErr('confirmErr');
});

// ── Form submit ──────────────────────────────────────────────
document.getElementById('regForm').addEventListener('submit',async function(e){
  e.preventDefault();

  // Clear all errors
  ['phoneErr','nameErr','emailErr','passwordErr','confirmErr'].forEach(clearErr);
  ['phone','name','password','confirmPassword'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.classList.remove('err','ok');}
  });
  const alert=document.getElementById('globalAlert');
  alert.className='alert error'; alert.textContent='';

  const phone=document.getElementById('phone').value.trim();
  const name=document.getElementById('name').value.trim();
  const gender=document.getElementById('gender').value;
  const email=document.getElementById('email').value.trim();
  const birthday=document.getElementById('birthday').value;
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirmPassword').value;
  const agreed=document.getElementById('agree').checked;

  let hasErr=false;
  if(!phone){setErr('phone','phoneErr','請輸入手機號碼');hasErr=true;}
  else if(!/^[0-9+\-\s]{8,20}$/.test(phone)){setErr('phone','phoneErr','手機號格式不正確（至少8位數字）');hasErr=true;}
  if(!name){setErr('name','nameErr','請輸入姓名');hasErr=true;}
  if(email&&!/\S+@\S+\.\S+/.test(email)){setErr('email','emailErr','Email 格式不正確');hasErr=true;}
  if(!password){setErr('password','passwordErr','請設定密碼');hasErr=true;}
  else if(password.length<6){setErr('password','passwordErr','密碼至少需要 6 位');hasErr=true;}
  if(!confirm){setErr('confirmPassword','confirmErr','請確認密碼');hasErr=true;}
  else if(confirm!==password){setErr('confirmPassword','confirmErr','兩次密碼不一致');hasErr=true;}
  if(!agreed){alert.textContent='請勾選同意服務條款';alert.classList.add('show');hasErr=true;}
  if(hasErr)return;

  const btn=document.getElementById('submitBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>註冊中…';

  try{
    const res=await fetch(API_BASE+'/api/member/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone,name,gender,email,birthday,password}),
    });
    const data=await res.json();
    if(!res.ok){
      alert.textContent=data.error||'註冊失敗，請稍後再試';
      alert.classList.add('show');
      btn.disabled=false;btn.textContent='立即免費加入';
      return;
    }
    localStorage.setItem('akb_member_token',data.token);
    localStorage.setItem('akb_member',JSON.stringify(data.member));
    location.href='./index.html?welcome=1';
  }catch(err){
    alert.textContent='網路連線失敗，請稍後再試';
    alert.classList.add('show');
    btn.disabled=false;btn.textContent='立即免費加入';
  }
});
</script>
</body>
</html>
